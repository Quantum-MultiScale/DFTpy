name: test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'docs-') && !startsWith(github.head_ref, 'release-') }}
    concurrency: # keep latest workflow and cancel exist workflow in PR
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies (FFTW + Open MPI)
      run: |
        sudo apt-get update
        sudo apt-get install -y libfftw3-dev libopenmpi-dev openmpi-bin

    - name: Setup Python virtual environment
      run: |
        uv python install ${{ matrix.python-version }} &&
        uv venv --python ${{ matrix.python-version }} &&
        uv sync --all-extras --all-groups

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest

    - name: Run PME force MPI regressions (2 and 4 ranks)
      timeout-minutes: 10
      env:
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
      run: |
        source .venv/bin/activate
        mpiexec --oversubscribe -n 2 python -m pytest --with-mpi tests/unit/test_pme_forces_mpi.py
        mpiexec --oversubscribe -n 4 python -m pytest --with-mpi tests/unit/test_pme_forces_mpi.py

