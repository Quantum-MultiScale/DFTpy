name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      task:
        description: 'Publish target.'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - testpypi
          - pypi
          - all

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Determine publish targets
        id: target
        run: |
          TASK="${{ inputs.task || 'none' }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              TASK="pypi"
            else
              echo "Tag ${github.ref} does not match vX.Y.Z format. Skipping auto-publish."
              TASK="none"
            fi
          fi

          if [[ "$TASK" == "pypi" || "$TASK" == "all" ]]; then
            echo "run_pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_pypi=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$TASK" == "testpypi" || "$TASK" == "all" ]]; then
            echo "run_testpypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_testpypi=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.target.outputs.run_pypi == 'true' || steps.target.outputs.run_testpypi == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: steps.target.outputs.run_pypi == 'true' || steps.target.outputs.run_testpypi == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build source distribution
        if: steps.target.outputs.run_pypi == 'true' || steps.target.outputs.run_testpypi == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Publish to TestPyPI
        if: steps.target.outputs.run_testpypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: steps.target.outputs.run_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
